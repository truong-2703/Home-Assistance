# Dashboard khách hàng: TruongHA · Căn hộ nhà anh Minh
title: TruongHA
views:
  - title: Tổng quan
    path: overview
    icon: mdi:home-heart
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            grid_options:
              columns: full
            text_only: true
            content: >
              {% set alarm_labels = {'disarmed': 'Tắt', 'armed_away': 'Đi vắng', 'armed_night': 'Ban đêm',
                 'triggered': '🚨 ĐANG BÁO ĐỘNG', 'armed_home': 'Ở nhà'} %}
              # <ha-icon icon="mdi:home-heart"></ha-icon> TruongHA · Căn hộ nhà anh Minh

              🕒 **{{ states('input_datetime.scenario_time')[:5] }}**  ·
              🏠 Chế độ: **{{ states('input_select.home_mode') }}**  ·
              🛡️ An ninh: **{{ alarm_labels.get(states('alarm_control_panel.apartment_security'), '…') }}**  ·
              🌡️ Ngoài trời **{{ states('sensor.outdoor_temperature') }}°C**  ·
              ⚡ **{{ states('sensor.apartment_power') }} W**
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: input_boolean.notification_visible
                state: "on"
            card:
              type: markdown
              text_only: true
              content: >
                {% set m = states('input_text.notification_level') %}
                {% set alert_type = {'critical': 'error', 'warning': 'warning', 'success': 'success'}.get(m, 'info') %}
                <ha-alert alert-type="{{ alert_type }}" title="{{ states('input_text.notification_title') }}">{{ states('input_text.notification_message') }}</ha-alert>
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: switch.kitchen_kettle_plug
                    state: "on"
                  - condition: state
                    entity: switch.kitchen_rice_cooker_plug
                    state: "on"
              - condition: state
                entity: input_select.home_mode
                state: "Đi vắng"
            card:
              type: tile
              entity: script.turn_off_kitchen_plugs
              hide_state: true
              name: "Ổ cắm bếp vẫn bật · bấm để tắt ngay"
              icon: mdi:power-plug-off
              color: amber
              vertical: false
              tap_action:
                action: perform-action
                perform_action: script.turn_off_kitchen_plugs
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: lock.front_door_lock
                state: unlocked
              - condition: state
                entity: input_select.home_mode
                state: "Ban đêm"
            card:
              type: tile
              entity: script.lock_front_door_remotely
              hide_state: true
              name: "Cửa chính chưa khóa · bấm để khóa"
              icon: mdi:lock-alert
              color: red
              tap_action:
                action: perform-action
                perform_action: script.lock_front_door_remotely
          - type: conditional
            grid_options:
              columns: 6
            conditions:
              - condition: state
                entity: alarm_control_panel.apartment_security
                state: triggered
            card:
              type: picture-entity
              entity: image.front_door_camera
              name: Ảnh chụp lúc cửa bị mở
              show_state: false
          - type: tile
            entity: script.mode_home
            hide_state: true
            name: Ở nhà
            color: green
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: script.mode_home
          - type: tile
            entity: script.mode_away
            hide_state: true
            name: Đi vắng
            color: blue
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: script.mode_away
          - type: tile
            entity: script.mode_movie
            hide_state: true
            name: Xem phim
            color: purple
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: script.mode_movie
          - type: tile
            entity: script.mode_sleep
            hide_state: true
            name: Đi ngủ
            color: indigo
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: script.mode_sleep
          - type: picture-elements
            grid_options:
              columns: full
            image: /local/floorplan/apartment.svg
            elements:
              - type: image
                entity: light.living_room_main_light
                image: /local/floorplan/transparent.svg
                state_image:
                  "on": /local/floorplan/light_glow.svg
                  "off": /local/floorplan/transparent.svg
