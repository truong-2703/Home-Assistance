  - title: Phòng
    path: rooms
    icon: mdi:floor-plan
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Phòng khách
            icon: mdi:sofa
          - type: tile
            entity: light.living_room_main_light
            name: Đèn chính
          - type: tile
            entity: light.living_room_accent_light
            name: Đèn trang trí
          - type: tile
            entity: media_player.living_room_tv
            name: TV
          - type: tile
            entity: cover.living_room_curtain
            name: Rèm
            features:
              - type: cover-open-close
          - type: tile
            entity: climate.living_room_ac
            name: Điều hòa
            grid_options:
              columns: full
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", cool]
              - type: target-temperature
          - type: tile
            entity: sensor.living_room_temperature
            name: Nhiệt độ
          - type: tile
            entity: sensor.living_room_humidity
            name: Độ ẩm
      - type: grid
        cards:
          - type: heading
            heading: Phòng ngủ master
            icon: mdi:bed-king
          - type: tile
            entity: light.master_bedroom_ceiling_light
            name: Đèn trần
          - type: tile
            entity: light.master_bedroom_night_light
            name: Đèn ngủ
          - type: tile
            entity: cover.master_bedroom_curtain
            name: Rèm
            features:
              - type: cover-open-close
          - type: tile
            entity: sensor.master_bedroom_temperature
            name: Nhiệt độ
          - type: tile
            entity: climate.master_bedroom_ac
            name: Điều hòa
            grid_options:
              columns: full
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", cool]
              - type: target-temperature
          - type: heading
            heading: Phòng bé
            icon: mdi:teddy-bear
          - type: tile
            entity: light.kids_room_light
            name: Đèn
          - type: tile
            entity: sensor.kids_room_temperature
            name: Nhiệt độ
          - type: tile
            entity: climate.kids_room_ac
            name: Điều hòa
            grid_options:
              columns: full
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", cool]
              - type: target-temperature
      - type: grid
        cards:
          - type: heading
            heading: Bếp
            icon: mdi:stove
          - type: tile
            entity: light.kitchen_light
            name: Đèn bếp
          - type: tile
            entity: switch.kitchen_kettle_plug
            name: Ấm siêu tốc
          - type: tile
            entity: switch.kitchen_rice_cooker_plug
            name: Nồi cơm
          - type: tile
            entity: binary_sensor.kitchen_smoke
            name: Khói
          - type: tile
            entity: binary_sensor.kitchen_gas
            name: Gas
          - type: heading
            heading: Hành lang & nhà tắm
            icon: mdi:door
          - type: tile
            entity: light.hallway_light
            name: Đèn hành lang
          - type: tile
            entity: binary_sensor.hallway_motion
            name: Chuyển động
          - type: tile
            entity: light.bathroom_light
            name: Đèn nhà tắm
          - type: tile
            entity: switch.bathroom_water_heater
            name: Bình nóng lạnh

  - title: An ninh
    path: security
    icon: mdi:shield-home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Báo động
            icon: mdi:shield-home
          - type: alarm-panel
            entity: alarm_control_panel.apartment_security
            name: An ninh căn hộ
            states:
              - arm_away
              - arm_night
          - type: tile
            entity: switch.apartment_siren
            name: Còi báo động
      - type: grid
        cards:
          - type: heading
            heading: Cửa chính
            icon: mdi:door-closed-lock
          - type: picture-entity
            entity: image.front_door_camera
            name: Camera cửa chính
            show_state: false
          - type: tile
            entity: lock.front_door_lock
            name: Khóa cửa
            features:
              - type: lock-commands
          - type: tile
            entity: binary_sensor.front_door_contact
            name: Cảm biến cửa
      - type: grid
        cards:
          - type: heading
            heading: Mã mở cửa tạm
            icon: mdi:account-key
          - type: markdown
            text_only: true
            content: >
              Cấp mã riêng cho người giúp việc, chỉ mở được cửa trong khung giờ cho phép.
              Mỗi lần mở cửa, chủ nhà nhận thông báo ngay.
          - type: entities
            entities:
              - entity: input_text.housekeeper_name
                name: Người được cấp mã
              - entity: input_text.housekeeper_temp_code
                name: Mã
              - entity: input_datetime.temp_code_valid_from
                name: Hiệu lực từ
              - entity: input_datetime.temp_code_valid_to
                name: Đến
          - type: heading
            heading: Cảnh báo khói & gas
            icon: mdi:fire-alert
          - type: tile
            entity: binary_sensor.kitchen_smoke
            name: Khói trong bếp
          - type: tile
            entity: binary_sensor.kitchen_gas
            name: Gas trong bếp

  - title: Năng lượng
    path: energy
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Đang tiêu thụ
            icon: mdi:flash
          - type: gauge
            entity: sensor.apartment_power
            name: Công suất cả nhà
            min: 0
            max: 6000
            needle: true
            severity:
              green: 0
              yellow: 1500
              red: 3500
          - type: entity
            entity: sensor.apartment_energy_demo
            name: Điện năng từ đầu buổi demo
          - type: history-graph
            title: Công suất trong 1 giờ qua
            hours_to_show: 1
            entities:
              - entity: sensor.apartment_power
                name: Công suất
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Tiền điện một tháng (minh họa)
            icon: mdi:cash
          - type: markdown
            content: |
              {#- Biểu giá điện sinh hoạt bậc thang EVN (đồng/kWh, chưa VAT), áp dụng từ 10/05/2025.
                  Kiểm tra lại biểu giá hiện hành trước khi demo. -#}
              {%- set tiers = [[50, 1984], [50, 2050], [100, 2380], [100, 2998], [100, 3350], [100000, 3460]] -%}
              {%- macro cost(kwh) -%}
                {%- set ns = namespace(remaining=kwh, total=0) -%}
                {%- for b in tiers -%}
                  {%- set used = [ns.remaining, b[0]] | min -%}
                  {%- set ns.total = ns.total + used * b[1] -%}
                  {%- set ns.remaining = ns.remaining - used -%}
                {%- endfor -%}
                {{- ns.total -}}
              {%- endmacro -%}
              {%- macro vnd(x) -%}{{ '{:,.0f}'.format(x | float).replace(',', '.') }} đ{%- endmacro -%}
              {%- set last_month = states('sensor.apartment_energy_last_month') | int -%}
              {%- set this_month = states('sensor.apartment_energy_this_month') | int -%}
              {%- set cost_last = cost(last_month) | float -%}
              {%- set cost_this = cost(this_month) | float -%}
              | | Điện năng | Tiền điện (chưa VAT) |
              |---|---:|---:|
              | Chưa có TruongHA | {{ last_month }} kWh | {{ vnd(cost_last) }} |
              | **Có TruongHA** | **{{ this_month }} kWh** | **{{ vnd(cost_this) }}** |
              | **Tiết kiệm** | **{{ last_month - this_month }} kWh ({{ ((last_month - this_month) / last_month * 100) | round(0) | int }}%)** | **{{ vnd(cost_last - cost_this) }} / tháng** |

              Tiết kiệm đến từ đâu:
              - Tự tắt điều hòa, đèn, bình nóng lạnh khi cả nhà đi vắng
              - Điều hòa phòng ngủ chạy chế độ ngủ 26°C thay vì để 22–23°C cả đêm
              - Bình nóng lạnh chỉ bật theo lịch (6:00 sáng) thay vì cắm cả ngày
              - Giảm bớt điện ở các bậc giá cao nhất của biểu giá bậc thang

              <ha-alert alert-type="info">Số liệu minh họa cho một căn hộ 2 phòng ngủ. Mức tiết kiệm thực tế tùy thói quen sử dụng của mỗi gia đình.</ha-alert>

