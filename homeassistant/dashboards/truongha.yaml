  - title: Năng lượng
    path: nang-luong
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Đang tiêu thụ
            icon: mdi:flash
          - type: gauge
            entity: sensor.can_ho_cong_suat
            name: Công suất cả nhà
            min: 0
            max: 6000
            needle: true
            severity:
              green: 0
              yellow: 1500
              red: 3500
          - type: entity
            entity: sensor.can_ho_dien_nang_buoi_demo
            name: Điện năng từ đầu buổi demo
          - type: history-graph
            title: Công suất trong 1 giờ qua
            hours_to_show: 1
            entities:
              - entity: sensor.can_ho_cong_suat
                name: Công suất
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Tiền điện một tháng (minh họa)
            icon: mdi:cash
          - type: markdown
            content: |
              {#- Biểu giá điện sinh hoạt bậc thang EVN (đồng/kWh, chưa VAT), áp dụng từ 10/05/2025.
                  Kiểm tra lại biểu giá hiện hành trước khi demo. -#}
              {%- set bac = [[50, 1984], [50, 2050], [100, 2380], [100, 2998], [100, 3350], [100000, 3460]] -%}
              {%- macro tien(kwh) -%}
                {%- set ns = namespace(con=kwh, tong=0) -%}
                {%- for b in bac -%}
                  {%- set dung = [ns.con, b[0]] | min -%}
                  {%- set ns.tong = ns.tong + dung * b[1] -%}
                  {%- set ns.con = ns.con - dung -%}
                {%- endfor -%}
                {{- ns.tong -}}
              {%- endmacro -%}
              {%- macro vnd(x) -%}{{ '{:,.0f}'.format(x | float).replace(',', '.') }} đ{%- endmacro -%}
              {%- set truoc = states('sensor.can_ho_dien_nang_thang_truoc') | int -%}
              {%- set nay = states('sensor.can_ho_dien_nang_thang_nay') | int -%}
              {%- set t1 = tien(truoc) | float -%}
              {%- set t2 = tien(nay) | float -%}
              | | Điện năng | Tiền điện (chưa VAT) |
              |---|---:|---:|
              | Chưa có TruongHA | {{ truoc }} kWh | {{ vnd(t1) }} |
              | **Có TruongHA** | **{{ nay }} kWh** | **{{ vnd(t2) }}** |
              | **Tiết kiệm** | **{{ truoc - nay }} kWh ({{ ((truoc - nay) / truoc * 100) | round(0) | int }}%)** | **{{ vnd(t1 - t2) }} / tháng** |

              Tiết kiệm đến từ đâu:
              - Tự tắt điều hòa, đèn, bình nóng lạnh khi cả nhà đi vắng
              - Điều hòa phòng ngủ chạy chế độ ngủ 26°C thay vì để 22–23°C cả đêm
              - Bình nóng lạnh chỉ bật theo lịch (6:00 sáng) thay vì cắm cả ngày
              - Giảm bớt điện ở các bậc giá cao nhất của biểu giá bậc thang

              <ha-alert alert-type="info">Số liệu minh họa cho một căn hộ 2 phòng ngủ. Mức tiết kiệm thực tế tùy thói quen sử dụng của mỗi gia đình.</ha-alert>

