# Dashboard khách hàng: TruongHA · Căn hộ nhà anh Minh
title: TruongHA
views:
  - title: Tổng quan
    path: tong-quan
    icon: mdi:home-heart
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            grid_options:
              columns: full
            text_only: true
            content: >
              {% set an_ninh = {'disarmed': 'Tắt', 'armed_away': 'Đi vắng', 'armed_night': 'Ban đêm',
                 'triggered': '🚨 ĐANG BÁO ĐỘNG', 'armed_home': 'Ở nhà'} %}
              # <ha-icon icon="mdi:home-heart"></ha-icon> TruongHA · Căn hộ nhà anh Minh

              🕒 **{{ states('input_datetime.gio_kich_ban')[:5] }}**  ·
              🏠 Chế độ: **{{ states('input_select.che_do_nha') }}**  ·
              🛡️ An ninh: **{{ an_ninh.get(states('alarm_control_panel.can_ho_an_ninh'), '…') }}**  ·
              🌡️ Ngoài trời **{{ states('sensor.ngoai_troi_nhiet_do') }}°C**  ·
              ⚡ **{{ states('sensor.can_ho_cong_suat') }} W**
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: input_boolean.co_thong_bao
                state: "on"
            card:
              type: markdown
              text_only: true
              content: >
                {% set m = states('input_text.thong_bao_muc_do') %}
                {% set loai = {'critical': 'error', 'warning': 'warning', 'success': 'success'}.get(m, 'info') %}
                <ha-alert alert-type="{{ loai }}" title="{{ states('input_text.thong_bao_tieu_de') }}">{{ states('input_text.thong_bao_noi_dung') }}</ha-alert>
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: switch.bep_o_cam_am_sieu_toc
                    state: "on"
                  - condition: state
                    entity: switch.bep_o_cam_noi_com
                    state: "on"
              - condition: state
                entity: input_select.che_do_nha
                state: "Đi vắng"
            card:
              type: tile
              entity: script.tat_o_cam_bep
              hide_state: true
              name: "Ổ cắm bếp vẫn bật · bấm để tắt ngay"
              icon: mdi:power-plug-off
              color: amber
              vertical: false
              tap_action:
                action: perform-action
                perform_action: script.tat_o_cam_bep
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: lock.cua_chinh_khoa
                state: unlocked
              - condition: state
                entity: input_select.che_do_nha
                state: "Ban đêm"
            card:
              type: tile
              entity: script.khoa_cua_tu_xa
              hide_state: true
              name: "Cửa chính chưa khóa · bấm để khóa"
              icon: mdi:lock-alert
              color: red
              tap_action:
                action: perform-action
                perform_action: script.khoa_cua_tu_xa
          - type: conditional
            grid_options:
              columns: 6
            conditions:
              - condition: state
                entity: alarm_control_panel.can_ho_an_ninh
                state: triggered
            card:
              type: picture-entity
              entity: image.cua_chinh_camera
              name: Ảnh chụp lúc cửa bị mở
              show_state: false
          - type: tile
            entity: script.che_do_o_nha
            hide_state: true
            name: Ở nhà
            color: green
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: script.che_do_o_nha
          - type: tile
            entity: script.che_do_di_vang
            hide_state: true
            name: Đi vắng
            color: blue
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: script.che_do_di_vang
          - type: tile
            entity: script.che_do_xem_phim
            hide_state: true
            name: Xem phim
            color: purple
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: script.che_do_xem_phim
          - type: tile
            entity: script.che_do_di_ngu
            hide_state: true
            name: Đi ngủ
            color: indigo
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: script.che_do_di_ngu
          - type: picture-elements
            grid_options:
              columns: full
            image: /local/floorplan/can_ho.svg
            elements:
