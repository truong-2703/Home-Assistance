  - title: Phòng
    path: phong
    icon: mdi:floor-plan
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Phòng khách
            icon: mdi:sofa
          - type: tile
            entity: light.phong_khach_den_chinh
            name: Đèn chính
          - type: tile
            entity: light.phong_khach_den_trang_tri
            name: Đèn trang trí
          - type: tile
            entity: media_player.phong_khach_tv
            name: TV
          - type: tile
            entity: cover.phong_khach_rem
            name: Rèm
            features:
              - type: cover-open-close
          - type: tile
            entity: climate.phong_khach_dieu_hoa
            name: Điều hòa
            grid_options:
              columns: full
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", cool]
              - type: target-temperature
          - type: tile
            entity: sensor.phong_khach_nhiet_do
            name: Nhiệt độ
          - type: tile
            entity: sensor.phong_khach_do_am
            name: Độ ẩm
      - type: grid
        cards:
          - type: heading
            heading: Phòng ngủ master
            icon: mdi:bed-king
          - type: tile
            entity: light.phong_ngu_master_den_tran
            name: Đèn trần
          - type: tile
            entity: light.phong_ngu_master_den_ngu
            name: Đèn ngủ
          - type: tile
            entity: cover.phong_ngu_master_rem
            name: Rèm
            features:
              - type: cover-open-close
          - type: tile
            entity: sensor.phong_ngu_master_nhiet_do
            name: Nhiệt độ
          - type: tile
            entity: climate.phong_ngu_master_dieu_hoa
            name: Điều hòa
            grid_options:
              columns: full
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", cool]
              - type: target-temperature
          - type: heading
            heading: Phòng bé
            icon: mdi:teddy-bear
          - type: tile
            entity: light.phong_be_den
            name: Đèn
          - type: tile
            entity: sensor.phong_be_nhiet_do
            name: Nhiệt độ
          - type: tile
            entity: climate.phong_be_dieu_hoa
            name: Điều hòa
            grid_options:
              columns: full
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", cool]
              - type: target-temperature
      - type: grid
        cards:
          - type: heading
            heading: Bếp
            icon: mdi:stove
          - type: tile
            entity: light.bep_den
            name: Đèn bếp
          - type: tile
            entity: switch.bep_o_cam_am_sieu_toc
            name: Ấm siêu tốc
          - type: tile
            entity: switch.bep_o_cam_noi_com
            name: Nồi cơm
          - type: tile
            entity: binary_sensor.bep_khoi
            name: Khói
          - type: tile
            entity: binary_sensor.bep_gas
            name: Gas
          - type: heading
            heading: Hành lang & nhà tắm
            icon: mdi:door
          - type: tile
            entity: light.hanh_lang_den
            name: Đèn hành lang
          - type: tile
            entity: binary_sensor.hanh_lang_chuyen_dong
            name: Chuyển động
          - type: tile
            entity: light.nha_tam_den
            name: Đèn nhà tắm
          - type: tile
            entity: switch.nha_tam_binh_nong_lanh
            name: Bình nóng lạnh

  - title: An ninh
    path: an-ninh
    icon: mdi:shield-home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Báo động
            icon: mdi:shield-home
          - type: alarm-panel
            entity: alarm_control_panel.can_ho_an_ninh
            name: An ninh căn hộ
            states:
              - arm_away
              - arm_night
          - type: tile
            entity: switch.can_ho_coi_bao_dong
            name: Còi báo động
      - type: grid
        cards:
          - type: heading
            heading: Cửa chính
            icon: mdi:door-closed-lock
          - type: picture-entity
            entity: image.cua_chinh_camera
            name: Camera cửa chính
            show_state: false
          - type: tile
            entity: lock.cua_chinh_khoa
            name: Khóa cửa
            features:
              - type: lock-commands
          - type: tile
            entity: binary_sensor.cua_chinh_cam_bien_cua
            name: Cảm biến cửa
      - type: grid
        cards:
          - type: heading
            heading: Mã mở cửa tạm
            icon: mdi:account-key
          - type: markdown
            text_only: true
            content: >
