# Bảng điều khiển cho người thuyết trình (khách không cần thấy trang này)
title: Điều khiển demo
views:
  - title: Kịch bản
    path: presenter
    icon: mdi:presentation-play
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            grid_options:
              columns: full
            text_only: true
            content: >
              # 🎬 Điều khiển demo TruongHA

              🕒 Giờ kịch bản **{{ states('input_datetime.scenario_time')[:5] }}** ·
              🏠 **{{ states('input_select.home_mode') }}** ·
              {% set alarm_labels = {'disarmed': 'Tắt', 'armed_away': 'Đi vắng', 'armed_night': 'Ban đêm',
                 'triggered': '🚨 ĐANG BÁO ĐỘNG', 'armed_home': 'Ở nhà'} %}
              🛡️ An ninh **{{ alarm_labels.get(states('alarm_control_panel.apartment_security'), '…') }}** ·
              📍 Anh Minh cách nhà **{{ states('input_number.distance_to_home') }} km**
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: input_boolean.notification_visible
                state: "on"
            card:
              type: markdown
              text_only: true
              content: >
                {% set m = states('input_text.notification_level') %}
                {% set alert_type = {'critical': 'error', 'warning': 'warning', 'success': 'success'}.get(m, 'info') %}
                <ha-alert alert-type="{{ alert_type }}" title="{{ states('input_text.notification_title') }}">{{ states('input_text.notification_message') }}</ha-alert>
      - type: grid
        cards:
          - type: heading
            heading: "Chuẩn bị"
            icon: mdi:restore
          - type: markdown
            text_only: true
            content: |
              - Mở dashboard **TruongHA** trên màn hình lớn (máy chiếu/TV).
              - Mở trang này trên điện thoại hoặc laptop của bạn, khách không cần thấy.
              - Bấm **Khôi phục** trước mỗi buổi demo: đưa căn hộ về 5:55 sáng, cả nhà đang ngủ.
          - type: tile
            entity: script.demo_reset
            hide_state: true
            name: "Khôi phục từ đầu"
            color: red
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_reset
          - type: tile
            entity: script.hide_notification
            hide_state: true
            name: "Ẩn thông báo"
            color: grey
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.hide_notification
      - type: grid
        cards:
          - type: heading
            heading: "Mở đầu · Tổng quan (2 phút)"
            icon: mdi:floor-plan
          - type: markdown
            text_only: true
            content: |
              - "Đây là toàn bộ ngôi nhà trên một màn hình, điện thoại cũng giống hệt."
              - Chỉ vào sơ đồ: phòng nào sáng đèn, nhiệt độ từng phòng, cửa đang khóa.
              - Bấm thử vào một phòng trên sơ đồ để bật/tắt đèn.
      - type: grid
        cards:
          - type: heading
            heading: "Cảnh 1 · Buổi sáng (2 phút)"
            icon: mdi:weather-sunset-up
          - type: markdown
            text_only: true
            content: |
              - Bấm nút, đồng hồ chạy 6:00 → 6:30.
              - 6:00 bình nóng lạnh tự bật. 6:30 đèn phòng ngủ bật, rèm mở, điều hòa phòng ngủ tắt, thông báo chào buổi sáng.
              - Sau đó chị Hà xuống bếp: đèn bếp và ấm siêu tốc bật (để dành cho cảnh 2).
              - **Điểm nhấn:** không cần chạm vào thứ gì.
          - type: tile
            entity: script.demo_scene_1_morning
            hide_state: true
            name: "6:00 → 6:30 Buổi sáng"
            color: orange
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_1_morning
      - type: grid
        cards:
          - type: heading
            heading: "Cảnh 2 · Cả nhà đi vắng (2 phút)"
            icon: mdi:home-export-outline
          - type: markdown
            text_only: true
            content: |
              - Cả nhà rời đi lúc 7:30. Mọi thứ tự tắt, cửa khóa, an ninh bật.
              - **Tình huống đắt giá:** ấm siêu tốc vẫn bật → hệ thống hỏi chủ nhà. Bấm "Tắt ngay" trên dashboard (hoặc trên thông báo điện thoại).
              - Giải thích: ổ cắm bếp không tự tắt vì có thể đang nấu cơm hẹn giờ, nên hệ thống hỏi trước.
          - type: tile
            entity: script.demo_scene_2_leave_home
            hide_state: true
            name: "7:30 Cả nhà ra khỏi nhà"
            color: blue
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_2_leave_home
      - type: grid
        cards:
          - type: heading
            heading: "Cảnh 3 · An ninh khi vắng nhà (3 phút)"
            icon: mdi:shield-home
          - type: markdown
            text_only: true
            content: |
              - 9:05 chị Lan (giúp việc) mở cửa bằng **mã tạm** → chủ nhà nhận thông báo, an ninh tạm tắt.
              - 11:00 chị Lan về → cửa tự khóa, an ninh bật lại.
              - 12:30 có người thử mã ngoài giờ → bị từ chối, chủ nhà được báo.
              - 14:00 cửa chính bị mở khi không có ai → còi, nháy đèn, ảnh camera, thông báo khẩn.
              - Sau đó vào tab **An ninh** để tắt báo động (mời khách tự bấm).
          - type: tile
            entity: script.demo_scene_3_housekeeper_arrives
            hide_state: true
            name: "9:05 Chị Lan vào bằng mã tạm"
            color: teal
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_3_housekeeper_arrives
          - type: tile
            entity: script.demo_scene_3_housekeeper_leaves
            hide_state: true
            name: "11:00 Chị Lan ra về"
            color: teal
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_3_housekeeper_leaves
          - type: tile
            entity: script.demo_scene_3_code_outside_hours
            hide_state: true
            name: "12:30 Thử mã ngoài giờ"
            color: amber
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_3_code_outside_hours
          - type: tile
            entity: script.demo_scene_3_break_in
            hide_state: true
            name: "14:00 Cửa chính bị mở"
            color: red
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_3_break_in
      - type: grid
        cards:
          - type: heading
            heading: "Cảnh 4 · Cảnh báo khói và gas (2 phút)"
            icon: mdi:fire-alert
          - type: markdown
            text_only: true
            content: |
              - **Khói:** còi kêu, bật toàn bộ đèn, mở khóa cửa để thoát hiểm, tắt điều hòa để khói không lan.
              - **Gas:** còi kêu, mở khóa cửa nhưng **cố ý không bật/tắt đèn** để tránh tia lửa điện, kèm hướng dẫn xử lý.
              - Nhấn mạnh: đây là lý do gia đình có trẻ nhỏ hoặc người già nên dùng hệ thống.
              - Bấm **Hết sự cố** để tắt còi trước khi sang cảnh 5.
          - type: tile
            entity: script.demo_scene_4_smoke
            hide_state: true
            name: "Có khói trong bếp"
            color: red
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_4_smoke
          - type: tile
            entity: script.demo_scene_4_gas
            hide_state: true
            name: "Rò rỉ gas"
            color: deep-orange
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_4_gas
          - type: tile
            entity: script.demo_scene_4_all_clear
            hide_state: true
            name: "Hết sự cố"
            color: green
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_4_all_clear
      - type: grid
        cards:
          - type: heading
            heading: "Cảnh 5 · Về nhà (2 phút)"
            icon: mdi:home-import-outline
          - type: markdown
            text_only: true
            content: |
              - 18:00 anh Minh còn cách nhà 2 km → điều hòa phòng khách tự bật trước (phòng đang 32°C, xem nhiệt độ giảm dần).
              - 18:15 mở khóa cửa → an ninh tự tắt, trời tối nên đèn hành lang và phòng khách tự bật.
              - Cửa vẫn để mở khóa (để dành cho cảnh Đi ngủ).
          - type: tile
            entity: script.demo_scene_5_almost_home
            hide_state: true
            name: "18:00 Còn 2 km"
            color: blue
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_5_almost_home
          - type: tile
            entity: script.demo_scene_5_arrive_home
            hide_state: true
            name: "18:15 Mở cửa về nhà"
            color: green
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_5_arrive_home
      - type: grid
        cards:
          - type: heading
            heading: "Cảnh 6 · Buổi tối (2 phút)"
            icon: mdi:weather-night
          - type: markdown
            text_only: true
            content: |
              - 20:00 **Xem phim:** tắt đèn chính, bật đèn trang trí, đóng rèm, bật TV.
              - 22:30 **Đi ngủ:** tắt hết đèn, điều hòa phòng ngủ 26°C chế độ ngủ, phát hiện **cửa chưa khóa** → bấm khóa từ xa.
              - 2:00 có người dậy đi vệ sinh → đèn hành lang và nhà tắm tự bật, tự tắt sau 20 giây không có chuyển động (nhà thật để 2 phút).
          - type: tile
            entity: script.demo_scene_6_movie
            hide_state: true
            name: "20:00 Xem phim"
            color: purple
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_6_movie
          - type: tile
            entity: script.demo_scene_6_bedtime
            hide_state: true
            name: "22:30 Đi ngủ"
            color: indigo
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_6_bedtime
          - type: tile
            entity: script.demo_scene_6_night_walk
            hide_state: true
            name: "2:00 Dậy đi vệ sinh"
            color: blue-grey
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_scene_6_night_walk
      - type: grid
        cards:
          - type: heading
            heading: "Cảnh 7 · Tiết kiệm điện (2 phút)"
            icon: mdi:lightning-bolt
          - type: markdown
            text_only: true
            content: |
              - Mở tab **Năng lượng**: công suất cả nhà thay đổi theo thiết bị đang bật.
              - Bảng so sánh tiền điện theo biểu giá bậc thang EVN: đây là con số khách quan tâm nhất.
              - Nói rõ đây là **số liệu minh họa**.
          - type: button
            name: Mở tab Năng lượng
            icon: mdi:open-in-app
            show_state: false
            grid_options:
              columns: full
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /truongha-home/nang-luong
      - type: grid
        cards:
          - type: heading
            heading: "Kết · Khách tự trải nghiệm (5 phút)"
            icon: mdi:account-group
          - type: markdown
            text_only: true
            content: |
              - Đưa điện thoại/tablet cho khách tự bấm trên sơ đồ nhà và các chế độ.
              - Giới thiệu 2 gói: **Cơ bản** (đèn, điều hòa, khóa, cảm biến cửa) và **Nâng cao** (đầy đủ như demo).
      - type: grid
        cards:
          - type: heading
            heading: "Phụ lục · Đèn LED phòng trọ (node ESP32)"
            icon: mdi:led-strip-variant
          - type: markdown
            text_only: true
            content: |
              - Mở tab **Phòng trọ**. Đây là node ESP32 tự làm, hiện đang giả lập.
              - **Vào phòng lúc trời tối:** đèn bật ngay, ánh sáng ấm 80% (sau 22:30 giờ thật: 10%, màu cam dịu).
              - **Trời tối dần khi đang ngồi:** đèn bật sau 1 phút phòng tối (chống bật nhầm khi mây che).
              - **Rời phòng:** đèn tự tắt sau 3 phút. Cảm biến mmWave biết cả người ngồi yên nên không tắt nhầm.
              - **Nút trên ESP32:** vẫn bật/tắt được khi Home Assistant hoặc WiFi chết.
          - type: tile
            entity: script.demo_rental_room_enter_dark
            name: "Có người vào phòng lúc trời tối"
            color: orange
            hide_state: true
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_rental_room_enter_dark
          - type: tile
            entity: script.demo_rental_room_getting_dark
            name: "Đang ngồi thì trời tối dần"
            color: amber
            hide_state: true
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_rental_room_getting_dark
          - type: tile
            entity: script.demo_rental_room_leave
            name: "Người rời phòng"
            color: blue-grey
            hide_state: true
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_rental_room_leave
          - type: tile
            entity: script.demo_rental_room_button
            name: "Bấm nút trên ESP32"
            color: teal
            hide_state: true
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_rental_room_button
          - type: tile
            entity: script.demo_rental_room_reset
            name: "Khôi phục phòng trọ"
            color: red
            hide_state: true
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: script.demo_rental_room_reset
      - type: grid
        cards:
          - type: heading
            heading: Điều khiển tay (khi cần)
            icon: mdi:tune
          - type: entities
            entities:
              - entity: input_datetime.scenario_time
              - entity: input_select.home_mode
              - entity: input_number.distance_to_home
              - entity: input_number.sim_outdoor_temperature
                name: Nhiệt độ ngoài trời
              - entity: input_boolean.sim_front_door_contact
                name: Cửa chính đang mở
              - entity: input_boolean.sim_hallway_motion
                name: Có chuyển động hành lang
              - entity: input_boolean.sim_kitchen_smoke
                name: Có khói
              - entity: input_boolean.sim_kitchen_gas
                name: Có gas
              - entity: input_text.phone_notify_service
                name: Gửi thông báo tới điện thoại
