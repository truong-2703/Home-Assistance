# Package Home Assistant: đèn LED tự động theo người + độ sáng + giờ trong ngày.
# Bật packages trong configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# Entity id dưới đây sinh ra từ friendly_name "Rental Room Bed" của node ESPHome
# esphome/rentalroom-bed-led.yaml — kiểm tra lại trong Settings > Devices nếu bạn đổi tên.

# Tên hiển thị tiếng Việt cho các entity của node (entity id giữ tiếng Anh)
homeassistant:
  customize:
    light.rental_room_bed_led_strip:
      friendly_name: "Phòng trọ · Đèn LED"
    binary_sensor.rental_room_bed_presence:
      friendly_name: "Phòng trọ · Có người"
    sensor.rental_room_bed_illuminance:
      friendly_name: "Phòng trọ · Độ sáng phòng"

input_boolean:
  rental_room_auto_light:
    name: Đèn tự động
    icon: mdi:motion-sensor

input_number:
  rental_room_lux_threshold:
    name: Ngưỡng lux bật đèn
    min: 0
    max: 200
    step: 5
    initial: 30
    unit_of_measurement: lx

automation:
  - id: rental_room_light_on_when_occupied
    alias: "Rental room light on when occupied"
    description: "Phòng trọ: bật đèn khi có người và trời tối"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.rental_room_bed_presence
        to: "on"
      # Đang ngồi trong phòng thì trời tối dần -> cũng phải bật đèn
      - trigger: numeric_state
        entity_id: sensor.rental_room_bed_illuminance
        below: input_number.rental_room_lux_threshold
        for: "00:01:00"
    conditions:
      - condition: state
        entity_id: input_boolean.rental_room_auto_light
        state: "on"
      - condition: state
        entity_id: binary_sensor.rental_room_bed_presence
        state: "on"
      # Không có số đo lux (chưa lắp BH1750 / cảm biến lỗi) -> coi như tối,
      # để thà bật đèn ban ngày còn hơn để người trong phòng ngồi tối.
      - condition: template
        value_template: >
          {% set lux = states('sensor.rental_room_bed_illuminance') %}
          {{ not is_number(lux)
             or lux | float < states('input_number.rental_room_lux_threshold') | float(30) }}
      - condition: state
        entity_id: light.rental_room_bed_led_strip
        state: "off"
    actions:
      - choose:
          # Ban đêm: ánh sáng ấm, rất dịu để không chói mắt
          - conditions:
              - condition: time
                after: "22:30:00"
                before: "06:00:00"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.rental_room_bed_led_strip
                data:
                  brightness_pct: 10
                  rgb_color: [255, 120, 30]
                  transition: 2
        default:
          - action: light.turn_on
            target:
              entity_id: light.rental_room_bed_led_strip
            data:
              brightness_pct: 80
              rgb_color: [255, 200, 140]
              transition: 1

  - id: rental_room_light_off_when_empty
    alias: "Rental room light off when empty"
    description: "Phòng trọ: tắt đèn khi không còn người"
    triggers:
      - trigger: state
        entity_id: binary_sensor.rental_room_bed_presence
        to: "off"
        for: "00:03:00"
    conditions:
      - condition: state
        entity_id: input_boolean.rental_room_auto_light
        state: "on"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.rental_room_bed_led_strip
        data:
          transition: 3
