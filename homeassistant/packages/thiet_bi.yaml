        unique_id: truongha_switch_phong_be_may_nen
        default_entity_id: switch.phong_be_may_nen
        icon: mdi:hvac
        state: "{{ is_state('input_boolean.gia_lap_phong_be_may_nen', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.gia_lap_phong_be_may_nen
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.gia_lap_phong_be_may_nen
  - lock:
      - name: "Cửa chính · Khóa"
        unique_id: truongha_lock_cua_chinh_khoa
        default_entity_id: lock.cua_chinh_khoa
        state: "{{ 'locked' if is_state('input_boolean.gia_lap_cua_chinh_khoa', 'on') else 'unlocked' }}"
        lock:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.gia_lap_cua_chinh_khoa
        unlock:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.gia_lap_cua_chinh_khoa
  - cover:
      - name: "Phòng khách · Rèm"
        unique_id: truongha_cover_phong_khach_rem
        default_entity_id: cover.phong_khach_rem
        device_class: curtain
        state: "{{ 'open' if is_state('input_boolean.gia_lap_phong_khach_rem', 'on') else 'closed' }}"
        open_cover:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.gia_lap_phong_khach_rem
        close_cover:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.gia_lap_phong_khach_rem
      - name: "Phòng ngủ master · Rèm"
        unique_id: truongha_cover_phong_ngu_master_rem
        default_entity_id: cover.phong_ngu_master_rem
        device_class: curtain
        state: "{{ 'open' if is_state('input_boolean.gia_lap_phong_ngu_master_rem', 'on') else 'closed' }}"
        open_cover:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.gia_lap_phong_ngu_master_rem
        close_cover:
