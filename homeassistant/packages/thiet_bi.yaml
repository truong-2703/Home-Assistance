      - name: "Cửa chính · Cảm biến cửa"
        unique_id: truongha_binary_cua_chinh_cam_bien_cua
        default_entity_id: binary_sensor.cua_chinh_cam_bien_cua
        device_class: door
        state: "{{ is_state('input_boolean.gia_lap_cua_chinh_cam_bien_cua', 'on') }}"
      - name: "Hành lang · Chuyển động"
        unique_id: truongha_binary_hanh_lang_chuyen_dong
        default_entity_id: binary_sensor.hanh_lang_chuyen_dong
        device_class: motion
        state: "{{ is_state('input_boolean.gia_lap_hanh_lang_chuyen_dong', 'on') }}"
      - name: "Bếp · Khói"
        unique_id: truongha_binary_bep_khoi
        default_entity_id: binary_sensor.bep_khoi
        device_class: smoke
        state: "{{ is_state('input_boolean.gia_lap_bep_khoi', 'on') }}"
      - name: "Bếp · Gas"
        unique_id: truongha_binary_bep_gas
        default_entity_id: binary_sensor.bep_gas
        device_class: gas
        state: "{{ is_state('input_boolean.gia_lap_bep_gas', 'on') }}"
  - sensor:
      - name: "Phòng khách · Nhiệt độ"
        unique_id: truongha_sensor_phong_khach_nhiet_do
        default_entity_id: sensor.phong_khach_nhiet_do
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.gia_lap_phong_khach_nhiet_do') | float(0) | round(1) }}"
      - name: "Phòng ngủ master · Nhiệt độ"
        unique_id: truongha_sensor_phong_ngu_master_nhiet_do
        default_entity_id: sensor.phong_ngu_master_nhiet_do
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.gia_lap_phong_ngu_master_nhiet_do') | float(0) | round(1) }}"
      - name: "Phòng bé · Nhiệt độ"
        unique_id: truongha_sensor_phong_be_nhiet_do
        default_entity_id: sensor.phong_be_nhiet_do
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.gia_lap_phong_be_nhiet_do') | float(0) | round(1) }}"
      - name: "Ngoài trời · Nhiệt độ"
        unique_id: truongha_sensor_ngoai_troi_nhiet_do
        default_entity_id: sensor.ngoai_troi_nhiet_do
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.gia_lap_ngoai_troi_nhiet_do') | float(0) | round(1) }}"
      - name: "Phòng khách · Độ ẩm"
        unique_id: truongha_sensor_phong_khach_do_am
        default_entity_id: sensor.phong_khach_do_am
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ states('input_number.gia_lap_phong_khach_do_am') | int(0) }}"

climate:
  - platform: generic_thermostat
    name: "Phòng khách · Điều hòa"
    unique_id: truongha_climate_phong_khach
    heater: switch.phong_khach_may_nen
    target_sensor: sensor.phong_khach_nhiet_do
    ac_mode: true
    min_temp: 16
    max_temp: 30
    target_temp: 25
    target_temp_step: 1
    precision: 0.5
    cold_tolerance: 0.3
    hot_tolerance: 0.3
    sleep_temp: 26
    initial_hvac_mode: "off"
  - platform: generic_thermostat
    name: "Phòng ngủ master · Điều hòa"
    unique_id: truongha_climate_phong_ngu_master
    heater: switch.phong_ngu_master_may_nen
    target_sensor: sensor.phong_ngu_master_nhiet_do
    ac_mode: true
    min_temp: 16
    max_temp: 30
    target_temp: 26
    target_temp_step: 1
    precision: 0.5
    cold_tolerance: 0.3
    hot_tolerance: 0.3
    sleep_temp: 26
    initial_hvac_mode: "off"
  - platform: generic_thermostat
    name: "Phòng bé · Điều hòa"
    unique_id: truongha_climate_phong_be
    heater: switch.phong_be_may_nen
    target_sensor: sensor.phong_be_nhiet_do
    ac_mode: true
    min_temp: 16
    max_temp: 30
    target_temp: 26
    target_temp_step: 1
    precision: 0.5
    cold_tolerance: 0.3
    hot_tolerance: 0.3
    sleep_temp: 26
    initial_hvac_mode: "off"

media_player:
  - platform: universal
    name: "Phòng khách · TV"
    unique_id: truongha_media_phong_khach_tv
    state_template: "{{ 'on' if is_state('input_boolean.gia_lap_phong_khach_tv', 'on') else 'off' }}"
    commands:
      turn_on:
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.gia_lap_phong_khach_tv
      turn_off:
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.gia_lap_phong_khach_tv
