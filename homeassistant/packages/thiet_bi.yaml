# Thiết bị giả lập của căn hộ.
# Mỗi thiết bị "thật" (đèn, ổ cắm, khóa, rèm, cảm biến...) được lưu trạng thái trong một
# helper ẩn tên gia_lap_* . Khi có phần cứng thật, chỉ cần thay thiết bị ảo bằng thiết bị thật
# có cùng entity_id là các automation và dashboard vẫn chạy nguyên vẹn.

input_boolean:
  gia_lap_phong_khach_den_chinh:
    name: "[Giả lập] Phòng khách · Đèn chính"
  gia_lap_phong_khach_den_trang_tri:
    name: "[Giả lập] Phòng khách · Đèn trang trí"
  gia_lap_phong_ngu_master_den_tran:
    name: "[Giả lập] Phòng ngủ master · Đèn trần"
  gia_lap_phong_ngu_master_den_ngu:
    name: "[Giả lập] Phòng ngủ master · Đèn ngủ"
  gia_lap_phong_be_den:
    name: "[Giả lập] Phòng bé · Đèn"
  gia_lap_bep_den:
    name: "[Giả lập] Bếp · Đèn"
  gia_lap_nha_tam_den:
    name: "[Giả lập] Nhà tắm · Đèn"
  gia_lap_hanh_lang_den:
    name: "[Giả lập] Hành lang · Đèn"
  gia_lap_bep_o_cam_am_sieu_toc:
    name: "[Giả lập] Bếp · Ổ cắm ấm siêu tốc"
  gia_lap_bep_o_cam_noi_com:
    name: "[Giả lập] Bếp · Ổ cắm nồi cơm"
  gia_lap_nha_tam_binh_nong_lanh:
    name: "[Giả lập] Nhà tắm · Bình nóng lạnh"
  gia_lap_can_ho_coi_bao_dong:
    name: "[Giả lập] Căn hộ · Còi báo động"
  gia_lap_phong_khach_may_nen:
    name: "[Giả lập] Phòng khách · Máy nén điều hòa"
  gia_lap_phong_ngu_master_may_nen:
    name: "[Giả lập] Phòng ngủ master · Máy nén điều hòa"
  gia_lap_phong_be_may_nen:
    name: "[Giả lập] Phòng bé · Máy nén điều hòa"
  gia_lap_cua_chinh_khoa:
    name: "[Giả lập] Khóa cửa chính (bật = đã khóa)"
    initial: true
  gia_lap_phong_khach_rem:
    name: "[Giả lập] Phòng khách · Rèm (bật = đang mở)"
  gia_lap_phong_ngu_master_rem:
    name: "[Giả lập] Phòng ngủ master · Rèm (bật = đang mở)"
  gia_lap_cua_chinh_cam_bien_cua:
    name: "[Giả lập] Cửa chính · Cảm biến cửa"
    initial: false
  gia_lap_hanh_lang_chuyen_dong:
    name: "[Giả lập] Hành lang · Chuyển động"
    initial: false
  gia_lap_bep_khoi:
    name: "[Giả lập] Bếp · Khói"
    initial: false
  gia_lap_bep_gas:
    name: "[Giả lập] Bếp · Gas"
    initial: false
  gia_lap_phong_khach_tv:
    name: "[Giả lập] TV phòng khách"

input_number:
  gia_lap_phong_khach_nhiet_do:
    name: "[Giả lập] Phòng khách · Nhiệt độ"
    min: 10
    max: 45
    step: 0.1
    initial: 29
    unit_of_measurement: "°C"
    mode: box
  gia_lap_phong_ngu_master_nhiet_do:
    name: "[Giả lập] Phòng ngủ master · Nhiệt độ"
    min: 10
    max: 45
    step: 0.1
    initial: 26.5
    unit_of_measurement: "°C"
    mode: box
  gia_lap_phong_be_nhiet_do:
    name: "[Giả lập] Phòng bé · Nhiệt độ"
    min: 10
    max: 45
    step: 0.1
    initial: 26.5
    unit_of_measurement: "°C"
    mode: box
  gia_lap_ngoai_troi_nhiet_do:
    name: "[Giả lập] Ngoài trời · Nhiệt độ"
    min: 10
    max: 45
    step: 0.1
    initial: 27
    unit_of_measurement: "°C"
    mode: box
  gia_lap_phong_khach_do_am:
    name: "[Giả lập] Phòng khách · Độ ẩm"
    min: 20
    max: 100
    step: 1
    initial: 68
    unit_of_measurement: "%"
    mode: box

template:
  - light:
      - name: "Phòng khách · Đèn chính"
        unique_id: truongha_light_phong_khach_den_chinh
        default_entity_id: light.phong_khach_den_chinh
        icon: mdi:ceiling-light
        state: "{{ is_state('input_boolean.gia_lap_phong_khach_den_chinh', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.gia_lap_phong_khach_den_chinh
