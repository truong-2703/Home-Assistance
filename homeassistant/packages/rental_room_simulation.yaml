# Giả lập node ESPHome "rentalroom-bed-led" (esphome/rentalroom-bed-led.yaml) để chạy
# automation trong rental_room_auto_light.yaml khi CHƯA có phần cứng.
#
# Entity id ở đây trùng đúng với entity id mà node thật tạo ra (friendly_name "Rental Room Bed"):
#   light.rental_room_bed_led_strip, binary_sensor.rental_room_bed_presence, sensor.rental_room_bed_illuminance
#
# KHI CÓ ESP32 THẬT: xóa file này, khởi động lại Home Assistant, vào
# Cài đặt > Thực thể xóa 3 thực thể giả lập cũ, rồi thêm node ESPHome. Automation giữ nguyên.

input_boolean:
  sim_rental_room_bed_led_strip:
    name: "[Giả lập] Phòng trọ · LED đang bật"
  sim_rental_room_bed_presence:
    name: "[Giả lập] Phòng trọ · Có người"
    initial: false

input_number:
  sim_rental_room_bed_led_brightness:
    name: "[Giả lập] Phòng trọ · Độ sáng LED"
    min: 1
    max: 255
    step: 1
    initial: 204
    mode: box
  sim_rental_room_bed_illuminance:
    name: "[Giả lập] Phòng trọ · Độ sáng phòng"
    min: 0
    max: 1000
    step: 5
    initial: 200
    unit_of_measurement: lx
    mode: slider

input_text:
  sim_rental_room_bed_led_color:
    name: "[Giả lập] Phòng trọ · Màu LED (r,g,b)"
    initial: "255,200,140"
    max: 20

template:
  - light:
      - name: "Phòng trọ · Đèn LED"
        unique_id: sim_rental_room_bed_led_strip
        default_entity_id: light.rental_room_bed_led_strip
        icon: mdi:led-strip-variant
        state: "{{ is_state('input_boolean.sim_rental_room_bed_led_strip', 'on') }}"
        level: "{{ states('input_number.sim_rental_room_bed_led_brightness') | int(204) }}"
        rgb: "({{ states('input_text.sim_rental_room_bed_led_color') }})"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sim_rental_room_bed_led_strip
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sim_rental_room_bed_led_strip
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.sim_rental_room_bed_led_brightness
            data:
              value: "{{ [brightness, 1] | max }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sim_rental_room_bed_led_strip
        set_rgb:
          - action: input_text.set_value
            target:
              entity_id: input_text.sim_rental_room_bed_led_color
            data:
              value: "{{ r }},{{ g }},{{ b }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sim_rental_room_bed_led_strip
  - binary_sensor:
      - name: "Phòng trọ · Có người"
        unique_id: sim_rental_room_bed_presence
        default_entity_id: binary_sensor.rental_room_bed_presence
        device_class: occupancy
        state: "{{ is_state('input_boolean.sim_rental_room_bed_presence', 'on') }}"
  - sensor:
      - name: "Phòng trọ · Độ sáng phòng"
        unique_id: sim_rental_room_bed_illuminance
        default_entity_id: sensor.rental_room_bed_illuminance
        device_class: illuminance
        state_class: measurement
        unit_of_measurement: lx
        state: "{{ states('input_number.sim_rental_room_bed_illuminance') | float(0) }}"

script:
  demo_rental_room_reset:
    alias: "Phòng trọ · Khôi phục"
    icon: mdi:restore
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.sim_rental_room_bed_presence
            - input_boolean.sim_rental_room_bed_led_strip
      - action: input_number.set_value
        target:
          entity_id: input_number.sim_rental_room_bed_illuminance
        data:
          value: 200
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.rental_room_auto_light

  demo_rental_room_enter_dark:
    alias: "Phòng trọ · Có người vào phòng lúc trời tối"
    icon: mdi:account-arrow-left
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.sim_rental_room_bed_illuminance
        data:
          value: 8
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.sim_rental_room_bed_presence

  demo_rental_room_getting_dark:
    alias: "Phòng trọ · Đang ngồi trong phòng thì trời tối dần"
    icon: mdi:weather-sunset-down
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.sim_rental_room_bed_led_strip
      - action: input_number.set_value
        target:
          entity_id: input_number.sim_rental_room_bed_illuminance
        data:
          value: 250
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.sim_rental_room_bed_presence
      - delay: 2
      - action: input_number.set_value
        target:
          entity_id: input_number.sim_rental_room_bed_illuminance
        data:
          value: 15

  demo_rental_room_leave:
    alias: "Phòng trọ · Người rời phòng"
    icon: mdi:account-arrow-right
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.sim_rental_room_bed_presence

  demo_rental_room_button:
    alias: "Phòng trọ · Bấm nút trên ESP32"
    icon: mdi:gesture-tap-button
    description: "Nút vật lý bật/tắt đèn ngay trên ESP, chạy cả khi Home Assistant hoặc WiFi chết."
    sequence:
      - action: light.toggle
        target:
          entity_id: light.rental_room_bed_led_strip
