# Kịch bản "Một ngày trong căn hộ thông minh".
# - Các automation phản ứng với cảm biến và đồng hồ như một hệ thống thật.
# - Đồng hồ kịch bản (input_datetime.gio_kich_ban) thay cho giờ thật, để người thuyết trình
#   "tua" tới 6:30, 14:00, 22:30... mà không phải chờ.
# - Các script demo_* là nút bấm trên dashboard "Điều khiển demo".

input_datetime:
  gio_kich_ban:
    name: "Giờ trong kịch bản"
    icon: mdi:clock-outline
    has_date: false
    has_time: true
    initial: "05:55"

input_select:
  che_do_nha:
    name: "Chế độ nhà"
    icon: mdi:home-switch
    options:
      - "Ở nhà"
      - "Đi vắng"
      - "Ban đêm"
    initial: "Ban đêm"

input_number:
  khoang_cach_ve_nha:
    name: "Anh Minh cách nhà"
    icon: mdi:map-marker-distance
    min: 0
    max: 20
    step: 0.5
    initial: 0
    unit_of_measurement: km
    mode: slider

input_boolean:
  co_thong_bao:
    name: "Đang hiện thông báo trên dashboard"

input_text:
  thong_bao_tieu_de:
    name: "Thông báo: tiêu đề"
    max: 120
  thong_bao_noi_dung:
    name: "Thông báo: nội dung"
    max: 255
  thong_bao_muc_do:
    name: "Thông báo: mức độ"
    max: 20
    initial: info
  dich_vu_thong_bao_dien_thoai:
    name: "Dịch vụ thông báo điện thoại"
    icon: mdi:cellphone-message
    # Ví dụ: mobile_app_iphone_cua_truong (xem README, mục "Nhận thông báo trên điện thoại")
    max: 100
    initial: ""

template:
  - binary_sensor:
      - name: "Trời tối"
        unique_id: truongha_troi_toi
        default_entity_id: binary_sensor.troi_toi
        icon: mdi:weather-night
        state: >
          {% set h = states('input_datetime.gio_kich_ban')[:2] | int(12) %}
          {{ h >= 18 or h < 6 }}

script:
  truongha_thong_bao:
    alias: "Gửi thông báo TruongHA"
    icon: mdi:bell-ring
    description: "Hiện thông báo trên dashboard, trong mục Thông báo và trên điện thoại (nếu đã cài app)."
    mode: queued
    fields:
      tieu_de:
        description: Tiêu đề
      noi_dung:
        description: Nội dung
      muc_do:
        description: "info / success / warning / critical"
      hinh_anh:
        description: Đường dẫn ảnh (tùy chọn)
      hanh_dong:
        description: Danh sách nút bấm trên thông báo điện thoại (tùy chọn)
    variables:
      gio: "{{ states('input_datetime.gio_kich_ban')[:5] }}"
      dich_vu: "{{ states('input_text.dich_vu_thong_bao_dien_thoai') | trim }}"
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.thong_bao_tieu_de
        data:
          value: "{{ gio }} · {{ tieu_de }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.thong_bao_noi_dung
        data:
          value: "{{ noi_dung[:255] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.thong_bao_muc_do
        data:
          value: "{{ muc_do | default('info') }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.co_thong_bao
      - action: persistent_notification.create
        data:
          title: "{{ gio }} · {{ tieu_de }}"
          message: >
            {{ noi_dung }}{% if hinh_anh is defined and hinh_anh %}

            ![Ảnh camera]({{ hinh_anh }}){% endif %}
      - if:
          - condition: template
            value_template: "{{ dich_vu not in ['', 'unknown', 'unavailable'] }}"
        then:
          - action: "notify.{{ dich_vu }}"
            continue_on_error: true
            data:
              title: "{{ tieu_de }}"
              message: "{{ noi_dung }}"
              data:
                image: "{{ hinh_anh | default('') }}"
                actions: "{{ hanh_dong | default([]) }}"
                push:
                  interruption-level: "{{ 'critical' if muc_do == 'critical' else 'active' }}"
                ttl: 0
                priority: high

  an_thong_bao:
    alias: "Ẩn thông báo"
    icon: mdi:bell-off
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.co_thong_bao

  # ---------- Các chế độ khách hàng bấm trên dashboard ----------
  che_do_di_vang:
    alias: "Đi vắng"
    icon: mdi:home-export-outline
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.che_do_nha
        data:
          option: "Đi vắng"

  che_do_o_nha:
    alias: "Ở nhà"
    icon: mdi:home-account
    sequence:
      - action: alarm_control_panel.alarm_disarm
        target:
          entity_id: alarm_control_panel.an_ninh_can_ho
      - action: input_select.select_option
        target:
          entity_id: input_select.che_do_nha
        data:
          option: "Ở nhà"

  che_do_xem_phim:
    alias: "Xem phim"
    icon: mdi:movie-open
    sequence:
      - action: light.turn_off
        target:
          entity_id: light.den_phong_khach
      - action: light.turn_on
        target:
          entity_id: light.den_trang_tri
      - action: cover.close_cover
        target:
          entity_id: cover.rem_phong_khach
      - action: media_player.turn_on
        target:
          entity_id: media_player.tv_phong_khach

  che_do_di_ngu:
    alias: "Đi ngủ"
    icon: mdi:bed
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.che_do_nha
        data:
          option: "Ban đêm"
      - action: light.turn_off
        target:
          entity_id: all
      - action: media_player.turn_off
        target:
          entity_id: media_player.tv_phong_khach
      - action: cover.close_cover
        target:
          entity_id: all
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.dieu_hoa_phong_khach
        data:
          hvac_mode: "off"
      - action: climate.set_hvac_mode
        target:
          entity_id:
            - climate.dieu_hoa_phong_master
            - climate.dieu_hoa_phong_be
        data:
          hvac_mode: cool
      - action: climate.set_preset_mode
        target:
          entity_id:
            - climate.dieu_hoa_phong_master
            - climate.dieu_hoa_phong_be
        data:
          preset_mode: sleep
      - action: alarm_control_panel.alarm_arm_night
        target:
          entity_id: alarm_control_panel.an_ninh_can_ho
      - if:
          - condition: state
            entity_id: lock.khoa_cua_chinh
            state: unlocked
        then:
          - action: script.truongha_thong_bao
            data:
              tieu_de: "Cửa chính chưa khóa"
              noi_dung: "Cả nhà đã đi ngủ nhưng cửa chính vẫn chưa khóa. Bấm \"Khóa cửa\" để khóa từ xa."
              muc_do: warning
              hanh_dong:
                - action: KHOA_CUA_CHINH
                  title: "Khóa cửa"
        else:
          - action: script.truongha_thong_bao
            data:
              tieu_de: "Chúc cả nhà ngủ ngon"
              noi_dung: "Đã tắt đèn, đóng rèm, điều hòa phòng ngủ chuyển chế độ ngủ 26°C. Cửa đã khóa, an ninh ban đêm đã bật."
              muc_do: success

  tat_o_cam_bep:
    alias: "Tắt ổ cắm bếp"
    icon: mdi:power-plug-off
    sequence:
      - action: switch.turn_off
        target:
          entity_id:
            - switch.o_cam_am_sieu_toc
            - switch.o_cam_noi_com
      - action: script.truongha_thong_bao
        data:
          tieu_de: "Đã tắt ổ cắm bếp"
          noi_dung: "Ấm siêu tốc và nồi cơm đã được tắt từ xa."
          muc_do: success

  khoa_cua_tu_xa:
    alias: "Khóa cửa từ xa"
    icon: mdi:lock
    sequence:
      - action: lock.lock
        target:
          entity_id: lock.khoa_cua_chinh
      - action: script.truongha_thong_bao
        data:
          tieu_de: "Đã khóa cửa chính"
          noi_dung: "Cửa chính đã được khóa từ xa. Chúc cả nhà ngủ ngon."
          muc_do: success

automation:
  # ---------- Cảnh 1: buổi sáng ----------
  - id: truongha_binh_nong_lanh_6h
    alias: "Buổi sáng: bật bình nóng lạnh lúc 6:00"
    triggers:
      - trigger: template
        value_template: "{{ states('input_datetime.gio_kich_ban')[:5] == '06:00' }}"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.binh_nong_lanh

  - id: truongha_chao_buoi_sang
    alias: "Buổi sáng: chào buổi sáng lúc 6:30"
    triggers:
      - trigger: template
        value_template: "{{ states('input_datetime.gio_kich_ban')[:5] == '06:30' }}"
    actions:
      - action: alarm_control_panel.alarm_disarm
        target:
          entity_id: alarm_control_panel.an_ninh_can_ho
      - action: input_select.select_option
        target:
          entity_id: input_select.che_do_nha
        data:
          option: "Ở nhà"
      - action: light.turn_on
        target:
          entity_id: light.den_master
      - action: cover.open_cover
        target:
          entity_id: all
      - action: climate.set_hvac_mode
        target:
          entity_id:
            - climate.dieu_hoa_phong_master
            - climate.dieu_hoa_phong_be
        data:
          hvac_mode: "off"
      - action: script.truongha_thong_bao
        data:
          tieu_de: "Chào buổi sáng nhà anh Minh!"
          noi_dung: "Ngoài trời {{ states('sensor.nhiet_do_ngoai_troi') }}°C. Đã mở rèm, tắt điều hòa phòng ngủ. Bình nóng lạnh đã bật từ 6:00, nước nóng sẵn sàng."
          muc_do: info

  # ---------- Cảnh 2: đi vắng ----------
  - id: truongha_di_vang
    alias: "Đi vắng: tắt hết, khóa cửa, bật an ninh"
    triggers:
      - trigger: state
        entity_id: input_select.che_do_nha
        to: "Đi vắng"
    actions:
      - action: light.turn_off
        target:
          entity_id: all
      - action: climate.set_hvac_mode
        target:
          entity_id: all
        data:
          hvac_mode: "off"
      - action: media_player.turn_off
        target:
          entity_id: media_player.tv_phong_khach
      - action: cover.close_cover
        target:
          entity_id: all
      - action: switch.turn_off
        target:
          entity_id: switch.binh_nong_lanh
      - action: lock.lock
        target:
          entity_id: lock.khoa_cua_chinh
      - action: alarm_control_panel.alarm_arm_away
        target:
          entity_id: alarm_control_panel.an_ninh_can_ho
      # Ổ cắm bếp không tự tắt (có thể đang nấu cơm hẹn giờ): hỏi chủ nhà.
      - variables:
          dang_bat: >
            {{ ['switch.o_cam_am_sieu_toc', 'switch.o_cam_noi_com']
               | select('is_state', 'on') | map('state_attr', 'friendly_name')
               | map('replace', 'Ổ cắm ', '') | list }}
      - if:
          - condition: template
            value_template: "{{ dang_bat | count > 0 }}"
        then:
          - action: script.truongha_thong_bao
            data:
              tieu_de: "Ổ cắm bếp vẫn đang bật"
              noi_dung: "Cả nhà đã ra khỏi nhà nhưng {{ dang_bat | join(' và ') }} vẫn đang bật. Bạn có muốn tắt không?"
              muc_do: warning
              hanh_dong:
                - action: TAT_O_CAM_BEP
                  title: "Tắt ngay"
        else:
          - action: script.truongha_thong_bao
            data:
              tieu_de: "Đã bật chế độ đi vắng"
              noi_dung: "Đã tắt đèn, điều hòa, TV, bình nóng lạnh; đóng rèm, khóa cửa và bật an ninh."
              muc_do: success

  - id: truongha_nut_tren_thong_bao
    alias: "Điện thoại: xử lý nút bấm trên thông báo"
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: TAT_O_CAM_BEP
        id: tat_o_cam
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: KHOA_CUA_CHINH
        id: khoa_cua
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: tat_o_cam
            sequence:
              - action: script.tat_o_cam_bep
          - conditions:
              - condition: trigger
                id: khoa_cua
            sequence:
              - action: script.khoa_cua_tu_xa

  # ---------- Cảnh 5: về nhà ----------
  - id: truongha_bat_dieu_hoa_truoc
    alias: "Về nhà: còn 2 km thì bật điều hòa phòng khách"
    triggers:
      - trigger: numeric_state
        entity_id: input_number.khoang_cach_ve_nha
        below: 2.1
    conditions:
      - condition: state
        entity_id: input_select.che_do_nha
        state: "Đi vắng"
      - condition: numeric_state
        entity_id: input_number.khoang_cach_ve_nha
        above: 0.4
    actions:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.dieu_hoa_phong_khach
        data:
          hvac_mode: cool
      - action: climate.set_temperature
        target:
          entity_id: climate.dieu_hoa_phong_khach
        data:
          temperature: 25
      - action: script.truongha_thong_bao
        data:
          tieu_de: "Anh Minh sắp về tới nhà"
          noi_dung: "Còn khoảng {{ states('input_number.khoang_cach_ve_nha') | float | round(1) }} km. Đã bật trước điều hòa phòng khách 25°C (trong nhà đang {{ states('sensor.nhiet_do_phong_khach') }}°C)."
          muc_do: info

  - id: truongha_ve_nha
    alias: "Về nhà: mở khóa cửa thì tắt an ninh, trời tối thì bật đèn"
    triggers:
      - trigger: state
        entity_id: lock.khoa_cua_chinh
        to: unlocked
    conditions:
      - condition: state
        entity_id: input_select.che_do_nha
        state: "Đi vắng"
      # Chỉ khi điện thoại chủ nhà đang ở nhà (người giúp việc dùng mã tạm thì không tính)
      - condition: numeric_state
        entity_id: input_number.khoang_cach_ve_nha
        below: 0.5
    actions:
      - action: alarm_control_panel.alarm_disarm
        target:
          entity_id: alarm_control_panel.an_ninh_can_ho
      - action: input_select.select_option
        target:
          entity_id: input_select.che_do_nha
        data:
          option: "Ở nhà"
      - if:
          - condition: state
            entity_id: binary_sensor.troi_toi
            state: "on"
        then:
          - action: light.turn_on
            target:
              entity_id:
                - light.den_hanh_lang
                - light.den_phong_khach
      - action: script.truongha_thong_bao
        data:
          tieu_de: "Chào mừng về nhà!"
          noi_dung: "An ninh đã tắt{{ ', đèn hành lang và phòng khách đã bật' if is_state('binary_sensor.troi_toi', 'on') else '' }}. Phòng khách đang {{ states('sensor.nhiet_do_phong_khach') }}°C."
          muc_do: success

  # ---------- Cảnh 6: ban đêm ----------
  - id: truongha_den_dem
    alias: "Ban đêm: có người đi lại thì bật đèn hành lang và nhà tắm"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.chuyen_dong_hanh_lang
        to: "on"
    conditions:
      - condition: state
        entity_id: input_select.che_do_nha
        state: "Ban đêm"
    actions:
      - action: light.turn_on
        target:
          entity_id:
            - light.den_hanh_lang
            - light.den_nha_tam
      - wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.chuyen_dong_hanh_lang
            to: "off"
            # Nhà thật nên để 2 phút; để 20 giây cho demo nhanh
            for: "00:00:20"
      - action: light.turn_off
        target:
          entity_id:
            - light.den_hanh_lang
            - light.den_nha_tam

  # ---------- Mô phỏng nhiệt độ phòng ----------
  - id: truongha_mo_phong_nhiet_do
    alias: "Giả lập: nhiệt độ phòng thay đổi theo điều hòa"
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/10"
    actions:
      - repeat:
          for_each:
            - phong_khach
            - master
            - phong_be
          sequence:
            - variables:
                hien_tai: "{{ states('input_number.gia_lap_nhiet_do_' ~ repeat.item) | float(28) }}"
                ngoai_troi: "{{ states('input_number.gia_lap_nhiet_do_ngoai_troi') | float(30) }}"
                moi: >
                  {% if is_state('switch.may_nen_' ~ repeat.item, 'on') %}
                    {{ [hien_tai - 0.3, 16] | max }}
                  {% elif hien_tai < ngoai_troi - 1 %}
                    {{ hien_tai + 0.1 }}
                  {% else %}
                    {{ hien_tai }}
                  {% endif %}
            - action: input_number.set_value
              target:
                entity_id: "input_number.gia_lap_nhiet_do_{{ repeat.item }}"
              data:
                value: "{{ moi | float | round(1) }}"

  - id: truongha_giao_dien
    alias: "Giao diện: dùng theme TruongHA"
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: frontend.set_theme
        data:
          name: TruongHA
          mode: light
      - action: frontend.set_theme
        data:
          name: TruongHA
          mode: dark
