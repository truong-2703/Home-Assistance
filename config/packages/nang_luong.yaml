# Năng lượng: công suất tức thời ước tính theo trạng thái thiết bị (giả lập đồng hồ điện),
# và số liệu MINH HỌA so sánh tiền điện một tháng có / không có tự động hóa.

template:
  - sensor:
      - name: "Công suất tiêu thụ"
        unique_id: truongha_cong_suat_tong
        default_entity_id: sensor.cong_suat_tieu_thu
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        # Tủ lạnh, router, thiết bị chờ... luôn khoảng 150 W
        state: >
          {% set w = namespace(tong=150) %}
          {% for e, cs in [
            ('light.den_phong_khach', 18), ('light.den_trang_tri', 12), ('light.den_master', 15),
            ('light.den_ngu_master', 6), ('light.den_phong_be', 15), ('light.den_bep', 12),
            ('light.den_nha_tam', 9), ('light.den_hanh_lang', 9),
            ('switch.o_cam_am_sieu_toc', 1800), ('switch.o_cam_noi_com', 650),
            ('switch.binh_nong_lanh', 2500), ('media_player.tv_phong_khach', 120),
            ('switch.may_nen_phong_khach', 1100), ('switch.may_nen_master', 800),
            ('switch.may_nen_phong_be', 800) ] %}
            {% if is_state(e, 'on') %}{% set w.tong = w.tong + cs %}{% endif %}
          {% endfor %}
          {# Điều hòa bật nhưng máy nén đang nghỉ: chỉ còn quạt dàn lạnh ~40 W #}
          {% for p in ['phong_khach', 'master', 'phong_be'] %}
            {% if not is_state('climate.dieu_hoa_' ~ ('phong_' ~ p if p == 'master' else p), 'off')
                  and is_state('switch.may_nen_' ~ p, 'off') %}
              {% set w.tong = w.tong + 40 %}
            {% endif %}
          {% endfor %}
          {{ w.tong }}

      - name: "Điện năng tháng trước (chưa có TruongHA)"
        unique_id: truongha_dien_nang_thang_truoc
        default_entity_id: sensor.dien_nang_thang_truoc
        icon: mdi:flash-outline
        unit_of_measurement: kWh
        state: "412"

      - name: "Điện năng tháng này (có TruongHA)"
        unique_id: truongha_dien_nang_thang_nay
        default_entity_id: sensor.dien_nang_thang_nay
        icon: mdi:flash
        unit_of_measurement: kWh
        state: "348"

sensor:
  - platform: integration
    name: "Điện năng trong buổi demo"
    unique_id: truongha_dien_nang_demo
    source: sensor.cong_suat_tieu_thu
    unit_prefix: k
    unit_time: h
    round: 3
    method: left
