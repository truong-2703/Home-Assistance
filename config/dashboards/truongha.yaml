  - title: Phòng
    path: phong
    icon: mdi:floor-plan
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Phòng khách
            icon: mdi:sofa
          - type: tile
            entity: light.den_phong_khach
            name: Đèn chính
          - type: tile
            entity: light.den_trang_tri
            name: Đèn trang trí
          - type: tile
            entity: media_player.tv_phong_khach
            name: TV
          - type: tile
            entity: cover.rem_phong_khach
            name: Rèm
            features:
              - type: cover-open-close
          - type: tile
            entity: climate.dieu_hoa_phong_khach
            name: Điều hòa
            grid_options:
              columns: full
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", cool]
              - type: target-temperature
          - type: tile
            entity: sensor.nhiet_do_phong_khach
            name: Nhiệt độ
          - type: tile
            entity: sensor.do_am_phong_khach
            name: Độ ẩm
      - type: grid
        cards:
          - type: heading
            heading: Phòng ngủ master
            icon: mdi:bed-king
          - type: tile
            entity: light.den_master
            name: Đèn trần
          - type: tile
            entity: light.den_ngu_master
            name: Đèn ngủ
          - type: tile
            entity: cover.rem_master
            name: Rèm
            features:
              - type: cover-open-close
          - type: tile
            entity: sensor.nhiet_do_master
            name: Nhiệt độ
          - type: tile
            entity: climate.dieu_hoa_phong_master
            name: Điều hòa
            grid_options:
              columns: full
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", cool]
              - type: target-temperature
          - type: heading
            heading: Phòng bé
            icon: mdi:teddy-bear
          - type: tile
            entity: light.den_phong_be
            name: Đèn
          - type: tile
            entity: sensor.nhiet_do_phong_be
            name: Nhiệt độ
          - type: tile
            entity: climate.dieu_hoa_phong_be
            name: Điều hòa
            grid_options:
              columns: full
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", cool]
              - type: target-temperature
      - type: grid
        cards:
          - type: heading
            heading: Bếp
            icon: mdi:stove
          - type: tile
            entity: light.den_bep
            name: Đèn bếp
          - type: tile
            entity: switch.o_cam_am_sieu_toc
            name: Ấm siêu tốc
          - type: tile
            entity: switch.o_cam_noi_com
            name: Nồi cơm
          - type: tile
            entity: binary_sensor.khoi_bep
            name: Khói
          - type: tile
            entity: binary_sensor.gas_bep
            name: Gas
          - type: heading
            heading: Hành lang & nhà tắm
            icon: mdi:door
          - type: tile
            entity: light.den_hanh_lang
            name: Đèn hành lang
          - type: tile
            entity: binary_sensor.chuyen_dong_hanh_lang
            name: Chuyển động
          - type: tile
            entity: light.den_nha_tam
            name: Đèn nhà tắm
          - type: tile
            entity: switch.binh_nong_lanh
            name: Bình nóng lạnh

  - title: An ninh
    path: an-ninh
    icon: mdi:shield-home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Báo động
            icon: mdi:shield-home
          - type: alarm-panel
            entity: alarm_control_panel.an_ninh_can_ho
            name: An ninh căn hộ
            states:
              - arm_away
              - arm_night
          - type: tile
            entity: switch.coi_bao_dong
            name: Còi báo động
      - type: grid
        cards:
          - type: heading
            heading: Cửa chính
            icon: mdi:door-closed-lock
          - type: picture-entity
            entity: image.camera_cua_chinh
            name: Camera cửa chính
            show_state: false
          - type: tile
            entity: lock.khoa_cua_chinh
            name: Khóa cửa
            features:
              - type: lock-commands
          - type: tile
            entity: binary_sensor.cua_chinh
            name: Cảm biến cửa
      - type: grid
        cards:
          - type: heading
            heading: Mã mở cửa tạm
            icon: mdi:account-key
          - type: markdown
            text_only: true
            content: >
              Cấp mã riêng cho người giúp việc, chỉ mở được cửa trong khung giờ cho phép.
              Mỗi lần mở cửa, chủ nhà nhận thông báo ngay.
          - type: entities
            entities:
              - entity: input_text.ten_nguoi_giup_viec
                name: Người được cấp mã
              - entity: input_text.ma_tam_nguoi_giup_viec
                name: Mã
              - entity: input_datetime.ma_tam_tu
                name: Hiệu lực từ
              - entity: input_datetime.ma_tam_den
                name: Đến
          - type: heading
            heading: Cảnh báo khói & gas
            icon: mdi:fire-alert
          - type: tile
            entity: binary_sensor.khoi_bep
            name: Khói trong bếp
          - type: tile
            entity: binary_sensor.gas_bep
            name: Gas trong bếp

  - title: Năng lượng
    path: nang-luong
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Đang tiêu thụ
            icon: mdi:flash
          - type: gauge
            entity: sensor.cong_suat_tieu_thu
            name: Công suất cả nhà
            min: 0
            max: 6000
            needle: true
            severity:
              green: 0
              yellow: 1500
              red: 3500
          - type: entity
            entity: sensor.dien_nang_trong_buoi_demo
            name: Điện năng từ đầu buổi demo
          - type: history-graph
            title: Công suất trong 1 giờ qua
            hours_to_show: 1
            entities:
              - entity: sensor.cong_suat_tieu_thu
                name: Công suất
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Tiền điện một tháng (minh họa)
            icon: mdi:cash
          - type: markdown
            content: |
              {#- Biểu giá điện sinh hoạt bậc thang EVN (đồng/kWh, chưa VAT), áp dụng từ 10/05/2025.
                  Kiểm tra lại biểu giá hiện hành trước khi demo. -#}
              {%- set bac = [[50, 1984], [50, 2050], [100, 2380], [100, 2998], [100, 3350], [100000, 3460]] -%}
              {%- macro tien(kwh) -%}
                {%- set ns = namespace(con=kwh, tong=0) -%}
                {%- for b in bac -%}
                  {%- set dung = [ns.con, b[0]] | min -%}
                  {%- set ns.tong = ns.tong + dung * b[1] -%}
                  {%- set ns.con = ns.con - dung -%}
                {%- endfor -%}
                {{- ns.tong -}}
              {%- endmacro -%}
              {%- macro vnd(x) -%}{{ '{:,.0f}'.format(x | float).replace(',', '.') }} đ{%- endmacro -%}
              {%- set truoc = states('sensor.dien_nang_thang_truoc') | int -%}
              {%- set nay = states('sensor.dien_nang_thang_nay') | int -%}
              {%- set t1 = tien(truoc) | float -%}
              {%- set t2 = tien(nay) | float -%}
              | | Điện năng | Tiền điện (chưa VAT) |
              |---|---:|---:|
              | Chưa có TruongHA | {{ truoc }} kWh | {{ vnd(t1) }} |
              | **Có TruongHA** | **{{ nay }} kWh** | **{{ vnd(t2) }}** |
              | **Tiết kiệm** | **{{ truoc - nay }} kWh ({{ ((truoc - nay) / truoc * 100) | round(0) | int }}%)** | **{{ vnd(t1 - t2) }} / tháng** |

              Tiết kiệm đến từ đâu:
              - Tự tắt điều hòa, đèn, bình nóng lạnh khi cả nhà đi vắng
              - Điều hòa phòng ngủ chạy chế độ ngủ 26°C thay vì để 22–23°C cả đêm
              - Bình nóng lạnh chỉ bật theo lịch (6:00 sáng) thay vì cắm cả ngày
              - Giảm bớt điện ở các bậc giá cao nhất của biểu giá bậc thang

              <ha-alert alert-type="info">Số liệu minh họa cho một căn hộ 2 phòng ngủ. Mức tiết kiệm thực tế tùy thói quen sử dụng của mỗi gia đình.</ha-alert>
