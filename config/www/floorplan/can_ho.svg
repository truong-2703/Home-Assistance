<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Mặt bằng căn hộ 2 phòng ngủ ~70 m² (minh họa) -->
  <rect width="1000" height="600" fill="#E9EEEC"/>

  <!-- Sàn từng phòng -->
  <rect x="40" y="40" width="480" height="290" fill="#FBF7F0"/>   <!-- phòng khách -->
  <rect x="40" y="330" width="260" height="230" fill="#F1F4F6"/>  <!-- bếp -->
  <rect x="300" y="330" width="220" height="230" fill="#F6F3EE"/> <!-- hành lang -->
  <rect x="520" y="40" width="440" height="260" fill="#F4F0FA"/>  <!-- master -->
  <rect x="520" y="300" width="180" height="260" fill="#EAF4F8"/> <!-- nhà tắm -->
  <rect x="700" y="300" width="260" height="260" fill="#FDF2F4"/> <!-- phòng bé -->

  <!-- Nội thất phòng khách -->
  <rect x="80" y="230" width="230" height="70" rx="14" fill="#C9D6D2"/>
  <rect x="80" y="230" width="230" height="20" rx="8" fill="#B4C5C0"/>
  <rect x="140" y="150" width="120" height="55" rx="8" fill="#E2D6C3"/>
  <rect x="120" y="52" width="170" height="12" rx="4" fill="#3C4A47"/>   <!-- TV -->
  <rect x="360" y="110" width="120" height="120" rx="60" fill="#E7DDCC"/> <!-- bàn ăn -->
  <circle cx="345" cy="170" r="14" fill="#D3C6B0"/><circle cx="495" cy="170" r="14" fill="#D3C6B0"/>
  <circle cx="420" cy="95" r="14" fill="#D3C6B0"/><circle cx="420" cy="245" r="14" fill="#D3C6B0"/>

  <!-- Bếp -->
  <rect x="52" y="342" width="236" height="44" fill="#CBD3D8"/>
  <rect x="52" y="386" width="44" height="160" fill="#CBD3D8"/>
  <circle cx="130" cy="364" r="12" fill="#8E9AA1"/><circle cx="165" cy="364" r="12" fill="#8E9AA1"/>
  <rect x="215" y="350" width="50" height="28" rx="6" fill="#A9B7BF"/>

  <!-- Master -->
  <rect x="700" y="90" width="190" height="170" rx="10" fill="#D9CCEB"/>
  <rect x="712" y="98" width="70" height="40" rx="8" fill="#FFFFFF"/>
  <rect x="808" y="98" width="70" height="40" rx="8" fill="#FFFFFF"/>
  <rect x="545" y="70" width="110" height="45" rx="6" fill="#E3D8C8"/>
  <rect x="905" y="110" width="40" height="40" rx="6" fill="#E3D8C8"/>

  <!-- Nhà tắm -->
  <rect x="540" y="470" width="140" height="70" rx="20" fill="#C6E2EE"/>
  <ellipse cx="640" cy="350" rx="22" ry="28" fill="#FFFFFF" stroke="#B5CFDA" stroke-width="3"/>
  <rect x="540" y="320" width="50" height="40" rx="6" fill="#FFFFFF" stroke="#B5CFDA" stroke-width="3"/>

  <!-- Phòng bé -->
  <rect x="800" y="380" width="130" height="150" rx="10" fill="#F6CBD5"/>
  <rect x="812" y="388" width="106" height="36" rx="8" fill="#FFFFFF"/>
  <rect x="720" y="320" width="60" height="60" rx="8" fill="#FFE2A8"/>
  <circle cx="750" cy="480" r="24" fill="#BFE3C9"/>

  <!-- Tường -->
  <g stroke="#2F3B38" stroke-width="10" fill="none" stroke-linecap="square">
    <rect x="40" y="40" width="920" height="520"/>
    <line x1="520" y1="40" x2="520" y2="150"/>
    <line x1="520" y1="220" x2="520" y2="380"/>
    <line x1="520" y1="450" x2="520" y2="560"/>
    <line x1="520" y1="300" x2="960" y2="300"/>
    <line x1="700" y1="300" x2="700" y2="560"/>
    <line x1="40" y1="330" x2="160" y2="330"/>
    <line x1="230" y1="330" x2="300" y2="330"/>
    <line x1="300" y1="330" x2="300" y2="400"/>
    <line x1="300" y1="470" x2="300" y2="560"/>
  </g>
  <!-- Cửa đi trong nhà -->
  <g stroke="#2F3B38" stroke-width="2" fill="none" stroke-dasharray="4 4">
    <path d="M520 150 A70 70 0 0 1 590 220"/>
    <path d="M520 380 A70 70 0 0 1 590 450"/>
    <path d="M700 380 A60 60 0 0 1 760 320"/>
    <path d="M300 400 A70 70 0 0 0 230 470"/>
  </g>
  <!-- Cửa chính -->
  <rect x="370" y="550" width="90" height="20" fill="#E9EEEC"/>
  <rect x="368" y="552" width="94" height="8" fill="#0E7C66"/>
  <text x="415" y="590" font-size="15" text-anchor="middle" fill="#0E7C66" font-weight="600">CỬA CHÍNH</text>
  <!-- Cửa sổ / rèm -->
  <g stroke="#7FB7D9" stroke-width="8">
    <line x1="330" y1="40" x2="500" y2="40"/>
    <line x1="560" y1="40" x2="680" y2="40"/>
    <line x1="960" y1="370" x2="960" y2="470"/>
  </g>

  <!-- Tên phòng -->
  <g font-size="20" font-weight="600" fill="#41504C" text-anchor="middle">
    <text x="200" y="128">Phòng khách</text>
    <text x="170" y="545">Bếp</text>
    <text x="410" y="360">Hành lang</text>
    <text x="800" y="285">Phòng ngủ master</text>
    <text x="610" y="455">Nhà tắm</text>
    <text x="830" y="545">Phòng bé</text>
  </g>
</svg>
