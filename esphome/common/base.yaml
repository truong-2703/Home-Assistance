# Cấu hình dùng chung cho MỌI node ESPHome trong nhà.
# Mỗi node chỉ cần khai báo substitutions: device_name, friendly_name, area
# rồi include file này — thêm thiết bị mới không phải viết lại WiFi/API/OTA.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: ${area}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mất WiFi -> node tự phát AP để cấu hình lại (hữu ích khi chuyển trọ / đổi router)
  ap:
    ssid: "${device_name}-fallback"
    password: !secret fallback_ap_password

captive_portal:

logger:

# Kết nối local, mã hoá tới Home Assistant (không qua cloud)
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Web UI tại http://<device_name>.local — vẫn điều khiển được khi Home Assistant chết
web_server:
  port: 80
  version: 3

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"

text_sensor:
  - platform: version
    name: "ESPHome Version"
